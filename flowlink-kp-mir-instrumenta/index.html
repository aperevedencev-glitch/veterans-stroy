<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FlowLink — видео к КП «МИР ИНСТРУМЕНТА»</title>
<style>
:root{--ink:#0f172a;--muted:#475569;--bg:#f1f5f9;--grad:linear-gradient(135deg,#6366f1,#06b6d4)}
@media (prefers-color-scheme:dark){:root{--ink:#e8eefc;--muted:#a3b0c5;--bg:#0b1120}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.li{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center}
h1{margin:0;font-size:clamp(26px,4vw,38px);line-height:1.15}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--muted)}
.vids{display:grid;grid-template-columns:3fr 1fr;gap:16px;align-items:start}
video{width:100%;height:auto;border-radius:20px;background:#0f172a;display:block}
.btn{display:inline-block;align-self:flex-start;background:var(--grad);color:#fff;font-weight:800;text-decoration:none;padding:12px 20px;border-radius:12px}
@media (max-width:760px){.vids{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="logo"><span class="li"><svg viewBox="0 0 64 64" width="18" height="18"><path d="M37 8 17 36h13l-4 20 21-30H34l3-18Z" fill="#fff"/></svg></span>FlowLink</div>
<h1>Меньше ручного ввода — <span class="g">больше времени на продажи</span></h1>
<p>Видео к коммерческому предложению: как заявки магазинов и дилеров сами попадают в CRM, 1С и Telegram менеджеров.</p>
<div class="vids">
<video controls preload="metadata" poster="poster-16x9.jpg" src="video-16x9.mp4" style="aspect-ratio:16/9"></video>
<video controls preload="metadata" poster="poster-9x16.jpg" src="video-9x16.mp4" style="aspect-ratio:9/16"></video>
</div>
<h2 style="margin:8px 0 0;font-size:22px">КП одним кадром</h2>
<a href="kp-kadr.png" target="_blank"><img src="kp-kadr.png" alt="КП одним кадром" style="width:100%;height:auto;border-radius:20px;display:block"></a>
<a class="btn" href="https://t.me/flow_linkbot?start=kp-audit_ab-4" target="_blank" rel="noopener">Записаться на бесплатный аудит в Telegram</a>
</div></body></html>
