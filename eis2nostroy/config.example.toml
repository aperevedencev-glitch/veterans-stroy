# Настройки модуля передачи сведений о договорах из ЕИС в НОСТРОЙ.
# Скопируйте в config.toml и заполните. Токен не храните в репозитории:
# его можно задать переменной окружения EIS_TOKEN.

[sro]
name = "Ассоциация СРО «Стройкорпорация»"
reg_number = "СРО-С-130-21122009"

[paths]
members = "data/members.xlsx"          # ИНН, наименование, дата уровня ОДО
cache_dir = "data/cache"               # скачанные архивы ЕИС
work_dir = "data/work"                 # найденные договоры (JSONL)
output_dir = "data/out"                # выгрузки для оператора и НОСТРОЙ
# Необязательные дополнительные источники (CSV/XLSX), см. README
finpod_import = ""                     # выгрузка «Финподдержки»
member_notices = ""                    # уведомления членов по регламенту
nostroy_registry = ""                  # уже переданные в НОСТРОЙ сведения

[period]
# Начало периода сверки. Для конкурентных договоров модуль дополнительно
# берёт дату уровня ОДО члена, но не ранее этой даты.
competitive_from = "2017-07-01"
noncompetitive_from = "2026-03-01"

[eis]
# Тип доступа: "IP" — физическое лицо, "LE" — юридическое лицо.
access = "IP"
token = ""                             # или переменная окружения EIS_TOKEN
# Имя элемента токена в SOAP-заголовке и HTTP-заголовке при скачивании архива.
# Для физлица по открытым примерам — individualPerson_token.
# Для юрлица проверьте по Альбому ТФФ ЕИС.
token_header = "individualPerson_token"
mode = "PROD"
timeout_sec = 60
# Не более 5000 запросов в час на пользователя (инструкция ЕИС): 0,75 с — 4800 в час.
min_interval_sec = 0.75
archive_retries = 6
archive_retry_wait_sec = 20

# Коды регионов заказчиков (как в ЕИС). Члены «Стройкорпорации» работают
# в основном с заказчиками Москвы и Московской области.
regions = ["50", "77"]

[eis.endpoints]
# С 2025 года ЕИС отдаёт данные 44-ФЗ и 223-ФЗ через один сервис getDocsIP
# (getDocsLE отвечает 404). Адрес проверен по WSDL 22.10.2026.
IP_44  = "https://int.zakupki.gov.ru/eis-integration/services/getDocsIP"
IP_223 = "https://int.zakupki.gov.ru/eis-integration/services/getDocsIP"

[[eis.feeds]]
law = "44"
endpoint_law = "44"
subsystem = "RGK"
document_types = ["contract"]

[[eis.feeds]]
law = "615"
endpoint_law = "44"
subsystem = "RD615"
document_types = ["contract"]

# Договоры 223-ФЗ. В большинстве из них (тип contractCutted) поставщик не указан.
# Для договора со строительными ОКПД2 (41, 42, 43 — то, что вносится в реестр
# НОСТРОЙ) модуль запрашивает протоколы закупки по её номеру
# (getDocsByReestrNumber, RI223) и находит победителя — члена СРО.
# Это 2 запроса на регион в день плюс по запросу на каждую строительную закупку.
[[eis.feeds]]
law = "223"
endpoint_law = "223"
subsystem = "RD223"
# contractCutted — публичная версия договора без сведений о поставщике.
document_types = ["contract", "contractCutted"]
regions = ["all"]
lookup_protocols = true

[matching]
date_tolerance_days = 3
price_tolerance_pct = 1.0

[alerts]
# Оповещения о сбоях и итогах прогона. Оставьте пустым, чтобы отключить.
telegram_bot_token = ""
telegram_chat_id = ""
smtp_host = ""
smtp_port = 587
smtp_user = ""
smtp_password = ""
email_to = ""

[nostroy]
# Спецификация API НОСТРОЙ для СРО пока не опубликована. До её получения
# модуль готовит файлы для загрузки оператором (mode = "file").
mode = "file"
api_url = ""
api_token = ""
